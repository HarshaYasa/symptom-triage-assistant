<!DOCTYPE html>
<html>
<head>
    <title>Query History - Symptom Triage Assistant</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        :root {
            --bg-page: #F4F8FA;
            --text-main: #1A2B3C;
            --text-heading: #14293B;
            --text-sub: #5B7285;
            --card-bg: #FFFFFF;
            --card-border: #E4EDF1;
            --row-border: #EEF3F5;
            --shadow: rgba(20, 41, 59, 0.06);
        }
        [data-theme="dark"] {
            --bg-page: #0F1720;
            --text-main: #E4EBF0;
            --text-heading: #F2F6F8;
            --text-sub: #93A4B3;
            --card-bg: #17222C;
            --card-border: #263442;
            --row-border: #1F2C38;
            --shadow: rgba(0, 0, 0, 0.3);
        }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            max-width: 780px;
            margin: 0 auto;
            padding: 48px 24px;
            background: var(--bg-page);
            color: var(--text-main);
            line-height: 1.6;
        }
        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 4px;
            color: var(--text-heading);
        }
        .subtitle {
            color: var(--text-sub);
            font-size: 14px;
            margin: 0;
        }
        .back-link {
            font-size: 14px;
            color: #2A7F9E;
            text-decoration: none;
            font-weight: 600;
        }
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--card-border);
            box-shadow: 0 1px 3px var(--shadow);
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13.5px;
        }
        th {
            text-align: left;
            padding: 12px 16px;
            font-size: 11.5px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-sub);
            border-bottom: 1.5px solid var(--card-border);
        }
        td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--row-border);
            vertical-align: top;
        }
        tr:last-child td {
            border-bottom: none;
        }
        .pill {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: white;
        }
        .pill-emergency { background: #DC3939; }
        .pill-see-soon { background: #E0A426; }
        .pill-routine { background: #23A566; }
        .pill-unknown { background: #7A8894; }
        .empty-state {
            padding: 48px 24px;
            text-align: center;
            color: var(--text-sub);
        }
        .timestamp {
            color: var(--text-sub);
            font-size: 12.5px;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="top-row">
        <div>
            <h1>Query history</h1>
            <p class="subtitle">Last 50 triage queries logged</p>
        </div>
        <div style="display: flex; gap: 16px; align-items: center;">
            <a href="/export-csv" class="back-link">⬇ Export CSV</a>
            <a href="/" class="back-link">&larr; Back to triage</a>
        </div>
    </div>
    <div class="card">
        {% if logs %}
        <table>
            <tr>
                <th>Time</th>
                <th>Symptoms</th>
                <th>Urgency</th>
                <th>Specialist</th>
            </tr>
            {% for log in logs %}
            <tr>
                <td class="timestamp">{{ log["timestamp"][:16] }}</td>
                <td>{{ log["symptoms"] }}</td>
                <td><span class="pill pill-{{ log['urgency'] }}">{{ log["urgency"] }}</span></td>
                <td>{{ log["specialist"] }}</td>
            </tr>
            {% endfor %}
        </table>
        {% else %}
        <div class="empty-state">No queries logged yet.</div>
        {% endif %}
    </div>
    <script>
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</body>
</html>
